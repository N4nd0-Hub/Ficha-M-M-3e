','Bônus & efeitos externos',actionButton('new-temporary','Adicionar efeito','plus','','small primary no-print'))}<div class="row wrap" style="margin-bottom:15px"><p class="hint" style="flex:1">Bônus e penalidades da sessão, com origem e duração.</p>${actionButton('temporary-preset','+1 Aparar / −1 Esquiva','','','small no-print')}</div>${renderTemporary(c)}</section><section class="panel">${textField('Notas de combate','combatNotes',c.combatNotes,'Táticas, recursos e lembretes da sessão…')}</section></div><aside class="stack combat-side"><section class="panel">${panelHead('','Defesas atuais')}<div class="combat-defenses">${DEFENSES.map(([k,n])=>{const value=defenseInCombat(c,k,calc),delta=calc.defenses[k]===null?0:calc.defenses[k]-num(base.defenses[k]);return `<div class="combat-defense"><span>${n}${delta?' <small class="defense-delta '+(delta>0?'positive':'negative')+'">'+signed(delta)+'</small>':''}${k==='toughness'&&c.injuries?'<small class="muted tiny"><br>Dano: −'+c.injuries+'</small>':''}</span><strong>${signed(value)}</strong><button class="btn small no-print" data-action="roll-defense" data-value="${k}" ${value===null?'disabled':''}>${ico('dice')}</button></div>`;}).join('')}</div><p class="hint" style="margin-top:12px">Totais já incluem modificadores ativos e as condições de defesa.</p></section><section class="panel roll-log">${panelHead('','Últimas rolagens',actionButton('clear-log','Limpar','','','small'))}<div class="roll-log">${c.log.length?c.log.slice().reverse().map(l=>`<div class="log-item"><div class="row between"><b>${esc(l.label)}</b><strong>${signed(l.total)}</strong></div><div class="row between" style="margin-top:4px"><span class="muted">d20 (${l.die}) ${signed(l.bonus)}</span><span class="log-time">${esc(l.time)}</span></div></div>`).join(''):'<p class="hint">As rolagens desta ficha aparecem aqui.</p>'}</div></section><section class="panel"><h3>Lembretes</h3><p class="hint" style="margin-top:10px">Área e percepção dispensam teste de ataque. Nas áreas comuns, Esquiva pode reduzir o efeito antes do salvamento indicado.</p><p class="hint" style="margin-top:10px">Os graus de falha se contam a cada 5 pontos abaixo da CD. Cada efeito ligado pode exigir seu próprio salvamento.</p></section></aside></div>`;}

function createCharacter(name='Novo herói',np=10){return {id:uid(),name,alias:'',player:'',concept:'',group:'',origin:'',role:'Herói',np,budget:np*15,budgetMode:'auto',visual:cleanVisual(),temporary:[],earned:0,portrait:'',gallery:[],importInfo:null,skillRounding:'half',unarmedCrit:20,archived:false,created:new Date().toISOString(),updated:new Date().toISOString(),abilities:Object.fromEntries(ATTRS.map(a=>[a[0],0])),defenses:{dodge:0,parry:0,fortitude:0,will:0},bonuses:{dodge:0,parry:0,fortitude:0,toughness:0,will:0,initiative:0},skills:SKILLS.map(s=>({id:s[0],name:s[1],attr:s[2],trained:s[3],ranks:0,bonus:0,kind:'core'})),advantages:[],powers:[],equipment:[],complications:[],heroPoints:1,injuries:0,conditions:[],notes:'',history:'',appearance:'',personality:'',allies:'',combatNotes:'',log:[]};}
function createEffect(type='Dano',rank=1){const d=EFFECTS[type]||EFFECTS.Personalizado;return {id:uid(),type,rank,base:d.cost,range:d.range||'Pessoal',action:d.action||'Livre',duration:d.duration||'Sustentada',resist:d.resist||'Nenhuma',attack:!!d.attack,area:false,attackMode:(d.range==='À distância'?'ranged':'close'),skillId:'',accuracy:0,strBased:false,apply:d.apply||'',mods:[],notes:'',label:'',enabled:true,crit:20,areaShape:'Explosão',areaRank:1,areaNotes:'',degrees:['','','','']};}
function createPower(name='Novo poder'){return {id:uid(),name,descriptor:'',description:'',parentId:'',enabled:true,selectedId:'',removable:0,alternateCost:1,arrayBaseSurcharge:0,manualCost:null,effects:[createEffect()]};}
function clone(v){return JSON.parse(JSON.stringify(v));}
function getAt(obj,path){return path.split('.').reduce((a,k)=>a?.[k],obj);}
function setAt(obj,path,value){const keys=path.split('.');let t=obj;for(let i=0;i<keys.length-1;i++)t=t[keys[i]];t[keys.at(-1)]=value;}
function advantageRanks(c,name){return c.advantages.filter(a=>a.name===name).reduce((n,a)=>n+num(a.rank),0);}
function effectCost(e){if(num(e.rank)<=0)return 0;const d=EFFECTS[e.type]||EFFECTS.Personalizado;const steps={'Perto':0,'À distância':1,'Percepção':2};const delta=steps[e.range]!==undefined&&steps[d.range]!==undefined?steps[e.range]-steps[d.range]:0;const per=num(e.base,1)+delta+(e.area?integer(e.areaRank,1,30,1):0)+e.mods.filter(m=>m.kind==='rank').reduce((n,m)=>n+num(m.value),0);const rate=per>=1?per:1/(2-per);const flats=e.mods.filter(m=>m.kind==='flat').reduce((n,m)=>n+num(m.value),0);return Math.max(1,Math.ceil(num(e.rank)*rate-1e-9)+flats);}
function powerRaw(p){return p.manualCost!==null&&p.manualCost!==''?Math.max(1,num(p.manualCost)):p.effects.reduce((sum,e)=>sum+effectCost(e),0);}
function powerGroupCost(c,p){if(p.parentId)return num(p.alternateCost,1);const group=powerRaw(p)+num(p.arrayBaseSurcharge)+c.powers.filter(a=>a.parentId===p.id).reduce((n,a)=>n+num(a.alternateCost,1),0);return group===0?0:Math.max(1,group-Math.ceil(group/5)*num(p.removable));}
function activePowers(c){return c.powers.filter(p=>{if(p.parentId){const root=c.powers.find(r=>r.id===p.parentId&&!r.parentId);return !!root&&root.enabled&&root.selectedId===p.id;}return p.enabled&&(!p.selectedId||p.selectedId===p.id||!c.powers.some(a=>a.id===p.selectedId&&a.parentId===p.id));});}
function skillTotal(c,s,calc=calculations(c)){const attr=calc.attrs[s.attr];return attr===null?null:num(attr)+num(s.ranks)+num(s.bonus)+num(calc.temp?.skillsAll)+num(calc.testPenalty)+(s.kind==='close'?advantageRanks(c,'Ataque Corpo-a-Corpo'):s.kind==='ranged'?advantageRanks(c,'Ataque à Distância'):0);}
function skillUsable(c,s){return c.abilities[s.attr]!==null&&(!s.trained||s.ranks>0||advantageRanks(c,'Faz Tudo')>0);}
function validation(c,calc=calculations(c)){
 calc=calculations(c,{temporary:false});
 const errors=[],info=[];const cap=2*num(c.np),sum=(a,b)=>a===null||b===null?null:a+b;
 const pairs=[['Esquiva + Resistência',sum(calc.defenses.dodge,calc.defenses.toughness)],['Aparar + Resistência',sum(calc.defenses.parry,calc.defenses.toughness)],['Fortitude + Vontade',sum(calc.defenses.fortitude,calc.defenses.will)]];
 if(calc.spent>calc.budget)errors.push(`Orçamento excedido em ${fmt(-calc.remaining)} PP.`);
 for(const [name,value]of pairs)if(value!==null&&value>cap)errors.push(`${name}: ${fmt(value)} / ${cap}.`);
 for(const s of c.skills){const total=skillTotal(c,s,calc);if(total!==null&&total>c.np+10)errors.push(`${s.name}: bônus ${signed(total)}, acima de NP + 10 (${c.np+10}).`);}
 for(const a of attacksFor(c,calc,true)){if(a.disabled)continue;const value=a.noRoll?a.rank:a.bonus+a.rank,limit=a.noRoll?c.np:cap;if(value>limit)errors.push(`${a.name}: ${a.noRoll?'graduação':'ataque + efeito'} ${fmt(value)} / ${limit}.`);}
 for(const p of c.powers){if(p.parentId){const parent=c.powers.find(r=>r.id===p.parentId&&!r.parentId);if(!parent)errors.push(`${p.name}: o poder base do arranjo não foi encontrado.`);else{if(powerRaw(p)>powerRaw(parent))errors.push(`${p.name}: alternativa de ${fmt(powerRaw(p))} PP supera a base de ${fmt(powerRaw(parent))} PP.`);if(p.effects.some(e=>e.duration==='Permanente')||parent.effects.some(e=>e.duration==='Permanente'))errors.push(`${p.name}: efeitos permanentes não podem participar de arranjos.`);}}for(const e of p.effects){if(['Crescimento','Encolhimento','Variável'].includes(e.type))info.push(`${p.name}: registre manualmente os ajustes de ${e.type.toLowerCase()} nas características correspondentes.`);if(e.type==='Característica Aumentada'&&!e.apply)info.push(`${p.name}: selecione a característica aumentada ou registre seu bônus na ficha.`);if(e.strBased&&calc.attrs.for===null)errors.push(`${p.name}: o dano baseado em Força exige essa habilidade.`);}}
 const equipSpent=c.equipment.reduce((s,e)=>s+num(e.cost)*num(e.quantity,1),0),equipBudget=5*advantageRanks(c,'Equipamento');if(equipSpent>equipBudget)errors.push(`Equipamento: ${fmt(equipSpent)} PE usados para ${equipBudget} PE disponíveis.`);
 for(const a of c.advantages){const def=ADVANTAGES.find(x=>x[0]===a.name);const max=a.name==='Sorte'?Math.floor(c.np/2):def?.[2];if(max>0&&a.rank>max||a.name==='Sorte'&&a.rank>Math.floor(c.np/2))errors.push(`${a.name}: graduação ${a.rank} supera o limite ${a.name==='Sorte'?Math.floor(c.np/2):max}.`);}
 if(advantageRanks(c,'Sorte')>Math.floor(c.np/2))errors.push(`Sorte: o total de graduações supera metade do NP (${Math.floor(c.np/2)}).`);
 if(Object.values(c.bonuses).some(v=>num(v)!==0)||c.skills.some(s=>num(s.bonus)!==0))info.push('Há bônus manuais. O custo da origem desses bônus deve estar registrado em poderes, vantagens ou equipamento.');
 return {errors:[...new Set(errors)],info:[...new Set(info)],pairs,equipSpent,equipBudget};
}

 const powerIdMap=new Map();c.powers=(Array.isArray(raw.powers)?raw.powers:[]).filter(x=>x&&typeof x==='object').slice(0,200).map(p=>{const id=uid();powerIdMap.set(p.id,id);return {id,name:text(p.name,180)||'Poder',descriptor:text(p.descriptor,500),description:text(p.description),parentId:p.parentId||'',enabled:p.enabled!==false,selectedId:p.selectedId||'',removable:integer(p.removable,0,2),alternateCost:integer(p.alternateCost,1,2,1),arrayBaseSurcharge:integer(p.arrayBaseSurcharge,0,1),sourceId:text(p.sourceId,120),manualCost:p.manualCost===null||p.manualCost===undefined||p.manualCost===''?null:bounded(p.manualCost,1,100000,1),effects:(Array.isArray(p.effects)?p.effects:[]).filter(x=>x&&typeof x==='object').slice(0,40).map(e=>{const effect=createEffect(Object.hasOwn(EFFECTS,e.type)?e.type:'Personalizado',integer(e.rank,0,200,1));effect.id=uid();effect.base=bounded(e.base,1,100,effect.base);effect.range=['Pessoal','Perto','À distância','Percepção','Graduação'].includes(e.range)?e.range:effect.range;effect.action=['Nenhuma','Livre','Reação','Movimento','Padrão','Rodada completa'].includes(e.action)?e.action:effect.action;effect.duration=['Instantânea','Concentração','Sustentada','Contínua','Permanente'].includes(e.duration)?e.duration:effect.duration;effect.resist=['Nenhuma','Resistência','Fortitude','Vontade','Esquiva','Força','Prontidão','Oposto'].includes(e.resist)?e.resist:effect.resist;effect.attack=!!e.attack;effect.area=!!e.area;effect.attackMode=e.attackMode==='ranged'?'ranged':'close';effect.skillId=c.skills.find(s=>(s.oldId||s.id)===e.skillId)?.id||'';effect.accuracy=integer(e.accuracy,-200,200);effect.strBased=!!e.strBased;effect.apply=[...ATTRS.map(a=>a[0]),...DEFENSES.map(a=>a[0]),'initiative'].includes(e.apply)?e.apply:'';effect.notes=text(e.notes);effect.areaShape=AREA_SHAPES.includes(e.areaShape)?e.areaShape:inferAreaShape(e.areaNotes||e.notes);effect.areaRank=integer(e.areaRank,1,30,1);effect.areaNotes=text(e.areaNotes,2000);effect.degrees=Array.from // IndexedDB recebe coleções com galerias que ultrapassam a cota do localStorage.
function indexedSave(operation,key,value){return new Promise((resolve,reject)=>{
 if(!globalThis.indexedDB){reject(Error('Armazenamento ampliado indisponível.'));return;}
 let request;try{request=indexedDB.open('mm3-arquivo-herois',1);}catch(err){reject(err);return;}
 request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('collections'))request.result.createObjectStore('collections');};
 request.onerror=()=>reject(request.error||Error('Falha ao abrir os dados locais.'));request.onblocked=()=>reject(Error('Feche outras abas da ficha e tente novamente.'));
 request.onsuccess=()=>{const db=request.result;let result=null;try{const tx=db.transaction('collections',operation==='get'?'readonly':'readwrite'),store=tx.objectStore('collections'),r=operation==='get'?store.get(key):store.put(value,key);r.onsuccess=()=>result=r.result;tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=()=>{db.close();reject(tx.error||Error('Falha ao guardar os dados locais.'));};tx.onabort=()=>{db.close();reject(tx.error||Error('Gravação local interrompida.'));};}catch(err){db.close();reject(err);}};
 });}
function installAppData(source){
 if(!source||source.schema!==APP_SCHEMA||!Array.isArray(source.characters)||!source.characters.length)return false;
 const chars=source.characters.slice(0,200).map(sanitizeCharacter);chars.forEach(c=>{if(!c.visual)c.visual=cleanVisual({theme:source.theme});});const seen=new Set();for(const c of chars){if(seen.has(c.id))c.id=uid();seen.add(c.id);}
 app={schema:APP_SCHEMA,format:1,instanceId:app.instanceId,savedAt:num(source.savedAt),theme:THEMES.includes(source.theme)?source.theme:'rubro',activeId:source.activeId,characters:chars};if(!chars.some(c=>c.id===app.activeId))app.activeId=chars[0].id;ui.collection=current().archived?'archived':'active';return true;
}
async function loadApp(){
 let source=null,lookup=false;
 try{const embedded=JSON.parse($('boot-data').textContent);if(embedded&&embedded.schema===APP_SCHEMA&&embedded.characters?.length){source=embedded;app.instanceId=/^[a-zA-Z0-9_-]{1,100}$/.test(embedded.instanceId)?embedded.instanceId:'default';}}catch{}
 const key=STORAGE_KEY+'.'+app.instanceId;
 try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.schema===APP_SCHEMA){if(saved.storedIn==='indexeddb')lookup=true;else source=saved;}else if(!source)lookup=true;}catch{lookup=true;ui.storageOK=false;}
 // Exibe a ficha imediatamente; galerias grandes são recuperadas em seguida.
 try{if(source)installAppData(source);}catch{ui.storageOK=false;}
 document.documentElement.dataset.theme=app.theme;$('theme-select').value=app.theme;render();updateSaveStatus();
 if(lookup&&globalThis.indexedDB){ui.loading=true;document.querySelector('.app-main').inert=true;document.querySelector('.sidebar').inert=true;updateSaveStatus();try{const json=await indexedSave('get',key);if(json){const restored=JSON.parse(json);if(!source||num(restored.savedAt)>=num(source.savedAt)){installAppData(restored);document.documentElement.dataset.theme=app.theme;$('theme-select').value=app.theme;render();ui.storageOK=true;}}}catch{ui.storageOK=false;}finally{ui.loading=false;document.querySelector('.app-main').inert=false;document.querySelector('.sidebar').inert=false;updateSaveStatus();}}
}
function persist(){
 clearTimeout(ui.saveTimer);ui.saveTimer=0;if(ui.loading)return false;
 app.savedAt=Math.max(Date.now(),num(app.savedAt)+1);const key=STORAGE_KEY+'.'+app.instanceId,serialized=JSON.stringify(app);const revision=++ui.storageRevision;
 try{localStorage.setItem(key,serialized);ui.storageOK=true;ui.storagePending=false;updateSaveStatus();return true;}
 catch{ui.storageOK=false;if(!globalThis.indexedDB){updateSaveStatus();return false;}}
 ui.storagePending=true;updateSaveStatus(true);
 ui.storagePromise=(ui.storagePromise||Promise.resolve()).catch(()=>{}).then(()=>indexedSave('put',key,serialized)).then(()=>{
  if(revision!==ui.storageRevision)return;try{localStorage.setItem(key,JSON.stringify({schema:APP_SCHEMA,instanceId:app.instanceId,savedAt:app.savedAt,storedIn:'indexeddb'}));}catch{}ui.storageOK=true;ui.storagePending=false;updateSaveStatus();
 }).catch(()=>{if(revision===ui.storageRevision){ui.storageOK=false;ui.storagePending=false;updateSaveStatus();}});return false;
}

function updateSaveStatus(pending=false){pending=pending||ui.storagePending;const s=$('save-status');s.textContent=ui.loading?'Recuperando fichas…':pending?'Salvando…':ui.storageOK?'Salvo neste navegador':'Exporte para guardar';s.title=ui.storageOK?'Salvamento local. Exporte JSON ou HTML para manter uma cópia.':'O navegador não permitiu salvar. Baixe um JSON ou HTML antes de fechar.';s.classList.toggle('unsaved',pending||!ui.storageOK);}
function touch(renderNow=false){current().updated=new Date().toISOString();updateSaveStatus(true);clearTimeout(ui.saveTimer);ui.saveTimer=setTimeout(persist,450);if(renderNow)render();}
function notify(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>el.classList.remove('show'),3800);}
function render(){const c=current();if(!c)return;const calc=calculations(c);applyVisual();document.title=(c.name||'Novo herói')+' · M&M';$('breadcrumb-name').textContent=c.name||'Novo herói';$('footer-summary').textContent=`NP ${c.np} · ${fmt(calc.spent)} / ${fmt(calc.budget)} PP`;$('sheet-tabs').innerHTML=TABS.map(([id,label,icon],i)=>`<button type="button" class="tab ${ui.tab===id?'active':''}" data-action="tab" data-value="${id}" aria-current="${ui.tab===id?'page':'false'}"><small>0${i+1}</small>${ico(icon)}${label}</button>`).join('');renderCollection();$('pages').innerHTML=TABS.map(([id])=>`<section id="page-${id}" class="page ${ui.tab===id?'':'hidden'}" aria-label="${TABS.find(t=>t[0]===id)[1]}">${({overview:renderOverview,skills:renderSkills,advantages:renderAdvantages,powers:renderPowers,combat:renderCombat,dossier:renderDossier}[id])(c,calc)}</section>`).join('');updateSaveStatus(!!ui.saveTimer);}
function renderCollection(){const q=norm(ui.search),list=app.characters.filter(c=>c.archived===(ui.collection==='archived')&&norm(c.name+' '+c.alias+' '+c.concept).includes(q));$('active-filter').classList.toggle('on',ui.collection==='active');$('archived-filter').classList.toggle('on',ui.collection==='archived');$('character-list').innerHTML=list.length?list.map(c=>`<button type="button" class="character-card ${c.id===app.activeId?'selected':''}" data-action="select-character" data-id="${c.id}"><span class="char-avatar">${c.portrait?`<img src="${c.portrait}" alt="">`:esc(c.name.slice(0,2).toUpperCase())}</span><span class="char-copy"><strong>${esc(c.name)}</strong><small>NP ${c.np} · ${esc(c.concept||c.role||'Herói')}</small></span>${c.id===app.activeId?'<span class="char-dot"></span>':''}</button>`).join(''):'<p class="tiny" style="color:var(--rail-muted);padding:10px 4px">Nenhum personagem por aqui.</p>';}
function panelHead(n,title,extra=''){return `<div class="panel-head"><h2><span class="section-number">${n}</span>${title}</h2>${extra}</div>`;}
function pageHeading(n,title,desc,button=''){return `<div class="page-heading"><div><div class="eyebrow">Arquivo do personagem / ${n}</div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`;}
function renderLimits(c,calc){const v=validation(c,calc);return `<div class="limits">${v.pairs.map(([name,value])=>`<div class="limit-line ${value!==null&&value>c.np*2?'invalid':''}"><div style="flex:1">${name}<div class="limit-track"><div style="width:${Math.min(100,Math.max(0,num(value)/(2*c.np)*100))}%"></div></div></div><span class="value">${value===null?'—':fmt(value)} <span class="muted">/ ${c.np*2}</span></span></div>`).join('')}</div>`;}
function renderOverview(c,calc){
 const v=validation(c,calc),labels={abilities:'Habilidades',skills:'Perícias',advantages:'Vantagens',powers:'Poderes',defenses:'Defesas'};
 return `<div class="overview-layout"><div class="overview-main"><section class="dossier-cover"><div class="dossier-strip"><span class="row">${ico('shield')} DOSSIÊ DE PERSONAGEM</span><span class="serial">M&M / 3ª EDIÇÃO</span></div><div class="identity-top"><div><div class="eyebrow">${esc(c.role||'Herói')} · ${esc(c.group||'Independente')}</div><div class="hero-name">${esc(c.name||'Novo herói')}</div><p class="hero-concept">${esc(c.concept||'Defina um nome, um conceito e a origem dos seus poderes.')}</p></div><div class="np-stamp"><small>NÍVEL DE PODER</small><strong>${c.np}</strong></div></div><div class="grid cols2 identity-fields">${inputField('Nome de herói / personagem','name',c.name,{maxlength:180})}${inputField('Identidade civil','alias',c.alias,{placeholder:'Nome por trás da máscara',maxlength:180})}${inputField('Conceito / arquétipo','concept',c.concept,{placeholder:'Ex.: velocista, místico, vigilante',maxlength:300})}${inputField('Jogador','player',c.player,{maxlength:180})}${inputField('Equipe / afiliação','group',c.group,{maxlength:300})}${inputField('Origem dos poderes','origin',c.origin,{placeholder:'Mutação, magia, tecnologia…',maxlength:300})}</div></section>
 <section class="panel">${panelHead('01','Habilidades','<span class="muted">2 PP por graduação</span>')}<div class="ability-grid">${ATTRS.map(([key,name,abbr])=>`<div class="ability-card"><div class="ability-name">${name}</div><div class="ability-value ${calc.auto[key]||calc.temp[key]?'enhanced':''} ${c.abilities[key]===null?'absent':''}">${signed(calc.attrs[key])}</div><div class="ability-details">${c.abilities[key]!==null?`<label><span class="sr-only">${name} base</span><input type="number" min="-5" max="200" step="1" data-field="abilities.${key}" value="${c.abilities[key]}" aria-label="${name} base"></label><span>${calc.auto[key]||calc.temp[key]?`${signed(calc.auto[key]+calc.temp[key])} bônus`:'base'}</span>`:`<span>Ausente · −10 PP</span>`}</div><div style="margin-top:9px" class="ability-details"><label><input type="checkbox" data-absent="${key}" ${c.abilities[key]===null?'checked':''} aria-label="${name} ausente"><span>Ausente</span></label></div></div>`).join('')}</div><p class="hint" style="margin-top:12px">A ficha mostra o total em destaque. Edite o valor base abaixo; poderes e bônus temporários ativos são somados automaticamente.</p></section>
 <section class="panel">${panelHead('02','Defesas',actionButton('edit-defenses','Ajustar','edit','','small no-print'))}<div class="defense-list">${DEFENSES.map(([k,name])=>`<div class="defense-item"><span>${name}</span><strong>${signed(calc.defenses[k])}</strong><small>${k==='dodge'||k==='parry'?'CD '+(calc.defenses[k]===null?'—':10+calc.defenses[k]):'Salvamento'}</small></div>`).join('')}</div></section>
 <section class="panel">${panelHead('03','Construção',actionButton('character-options','Gerenciar ficha','edit','','small no-print'))}<div class="grid cols4">${inputField('Nível de poder','np',c.np,{type:'number',min:1,max:100})}${inputField(c.budgetMode==='auto'?'PP iniciais · NP × 15':'PP iniciais · personalizado','budget',c.budgetMode==='auto'?c.np*15:c.budget,{type:'number',min:0,max:100000,step:.5})}${inputField('PP ganhos','earned',c.earned,{type:'number',min:0,max:100000,step:.5})}${selectField('Tipo de personagem','role',c.role,['Herói','Vilão','Anti-herói','Aliado','NPC'])}</div><div class="grid cols2" style="margin-top:16px">${selectField('Orçamento inicial','budgetMode',c.budgetMode,[['auto','Automático · NP × 15'],['manual','Personalizado']])}<p class="hint" style="align-self:end;padding-bottom:8px">Os PP iniciais acompanham o NP no modo automático. PP ganhos são somados separadamente.</p></div>${renderConstructionReview(c)}</section></div>
 <aside class="overview-side"><section class="panel portrait-panel"><div class="portrait">${c.portrait?`<img src="${c.portrait}" alt="Retrato de ${esc(c.name)}">`:`<svg class="portrait-silhouette" viewBox="0 0 160 200" aria-hidden="true"><path fill="currentColor" d="M80 17c-21 0-34 16-34 38 0 16 7 31 17 38l-8 17-25 14-13 64h126l-13-64-25-14-8-17c11-8 17-22 17-38 0-22-13-38-34-38Z"/><path d="M27 188h106M80 14v179M10 100h140" stroke="currentColor" opacity=".5" fill="none" stroke-dasharray="3 5"/><circle cx="80" cy="85" r="65" stroke="currentColor" fill="none" opacity=".7"/></svg>`}<button class="btn" data-action="portrait">${ico('image')}${c.portrait?'Trocar retrato':'Adicionar retrato'}</button></div><div class="portrait-caption"><span>IDENTIFICAÇÃO VISUAL</span>${c.portrait?`<button class="btn small no-print" data-action="remove-portrait" style="font-size:8px;min-height:20px;padding:0 4px">Remover</button>`:'<span>SEM FOTO</span>'}</div></section>
 <section class="panel"><div class="eyebrow">Pontos de poder</div><div class="budget-number">${fmt(calc.spent)} <small>/ ${fmt(calc.budget)}</small></div><div class="progress"><div style="width:${Math.min(100,Math.max(0,calc.spent/Math.max(1,calc.budget)*100))}%"></div></div><span class="badge ${calc.remaining<0?'bad':'good'}">${calc.remaining>=0?fmt(calc.remaining)+' PP disponíveis':fmt(-calc.remaining)+' PP excedentes'}</span><div class="budget-breakdown">${Object.entries(labels).map(([k,name])=>`<div class="budget-line"><span><i class="budget-dot"></i>${name}</span><strong>${fmt(calc.breakdown[k])}</strong></div>`).join('')}<div class="budget-line budget-total"><span>Total investido</span><strong>${fmt(calc.spent)} PP</strong></div></div></section>
 <section class="panel side-limits">${panelHead('','Limites do NP')} ${renderLimits(c,calc)}<div class="sep"></div><p class="hint">Perícias: bônus máximo <strong>${c.np+10}</strong>.<br>Ataque + efeito: até <strong>${c.np*2}</strong>.<br>Área / percepção: efeito até <strong>${c.np}</strong>.</p></section><div class="session-mini">${ico('star')}<div><strong>${c.heroPoints} ${c.heroPoints===1?'ponto heroico':'pontos heroicos'}</strong><p>Recursos e condições na página Combate.</p></div></div></aside></div>`;
}
function renderSkills(c,calc){const visible=c.skills.filter(s=>norm(s.name).includes(norm(ui.skillSearch))&&(ui.skillFilter!=='trained'||s.ranks>0));return `${pageHeading('02','Treinamento & talento','Cada 2 graduações de perícia custam 1 PP. Clique no total para rolar um teste.',actionButton('add-specialty','Especialização','plus','','primary no-print'))}<div class="grid cols3" style="margin-bottom:19px"><div class="readout"><span>Graduações compradas</span><strong>${fmt(calc.ranks)}</strong></div><div class="readout"><span>Custo em pontos de poder</span><strong>${fmt(calc.breakdown.skills)} PP</strong></div><div class="readout"><span>Limite do bônus total</span><strong>+${c.np+10}</strong></div></div><div class="toolbar no-print"><input type="search" id="skill-search" value="${esc(ui.skillSearch)}" placeholder="Buscar perícia…" aria-label="Buscar perícia"><div class="row">${actionButton('skill-filter','Todas','','data-value="all"',ui.skillFilter==='all'?'small primary':'small')}${actionButton('skill-filter','Com graduações','','data-value="trained"',ui.skillFilter==='trained'?'small primary':'small')}</div></div><div class="skill-grid">${visible.map(s=>{const total=skillTotal(c,s,calc),usable=skillUsable(c,s);return `<div class="skill-row ${total!==null&&total>c.np+10?'over-cap':''}"><div><h3>${esc(s.name)}</h3><div class="skill-subtitle"><span>${ATTRS.find(a=>a[0]===s.attr)?.[2]||'INT'}</span><span>·</span><span>${s.trained?'Exige treinamento':'Uso livre'}</span>${s.kind!=='core'?`<button type="button" class="btn small no-print" style="min-height:18px;padding:0 4px;font-size:8px" data-action="edit-specialty" data-id="${s.id}">Editar</button>`:''}</div></div><label><span>Grad.</span><input type="number" min="0" max="200" data-skill="${s.id}" data-key="ranks" value="${s.ranks}" aria-label="Graduações de ${esc(s.name)}"></label><label><span>Bônus¹</span><input type="number" min="-200" max="200" data-skill="${s.id}" data-key="bonus" value="${s.bonus}" aria-label="Bônus manual de ${esc(s.name)}"></label><button class="roll-total" type="button" data-action="roll-skill" data-id="${s.id}" ${usable?'':'disabled'} title="${usable?'Rolar '+esc(s.name):'Perícia indisponível sem treinamento ou habilidade'}" aria-label="${usable?'Rolar '+esc(s.name):'Indisponível'}">${total===null?'—':signed(total)}</button></div>`;}).join('')||'<div class="empty span2"><p>Nenhuma perícia encontrada.</p></div>'}</div><p class="hint" style="margin-top:17px">${c.skillRounding==='up'?'Custos de perícias arredondados para cima, como no Poder Supremo. ':''}¹ Use Bônus para ajustes concedidos por poderes, equipamento ou regras da mesa. O custo precisa ser lançado na fonte. Bônus de Ataque Corpo-a-Corpo e Ataque à Distância entram automaticamente nas especializações correspondentes.</p>`;}
function renderAdvantages(c,calc){return `${pageHeading('03','Vantagens','Recursos especiais, técnicas de combate e talentos que definem o personagem.',actionButton('advantage-catalog','Adicionar vantagem','plus','','primary no-print'))}<div class="row between" style="margin-bottom:17px"><span class="badge accent">${c.advantages.length} ${c.advantages.length===1?'vantagem':'vantagens'}</span><strong class="small-text">${fmt(calc.breakdown.advantages)} PP investidos</strong></div>${c.advantages.length?`<div class="item-list">${c.advantages.map(a=>{const d=ADVANTAGES.find(x=>x[0]===a.name);return `<article class="list-card"><div class="list-card-title"><div><div class="eyebrow">${esc(d?.[1]||'Personalizada')}</div><h3>${esc(a.name)}</h3></div><div class="card-actions"><label><span class="sr-only">Graduação de ${esc(a.name)}</span><input class="adv-rank" type="number" min="1" max="200" data-advantage="${a.id}" value="${a.rank}"></label><span class="count-chip">PP</span>${iconButton('edit-advantage','Editar detalhes','edit',`data-id="${a.id}"`)}${iconButton('delete-advantage','Remover vantagem','trash',`data-id="${a.id}"`)}</div></div><p class="adv-description">${esc(a.notes||d?.[3]||'Adicione os detalhes desta vantagem.')}</p></article>`;}).join('')}</div>`:emptyState('star','Talentos que fazem a diferença','Escolha as vantagens do livro ou crie uma entrada própria para as regras da sua mesa.',actionButton('advantage-catalog','Escolher vantagens','plus','','primary no-print'))}<div class="note" style="margin-top:19px">Iniciativa Aprimorada, Ataque à Distância, Ataque Corpo-a-Corpo, Rolamento Defensivo, Faz Tudo e Equipamento têm integração automática. Registre efeitos circunstanciais e detalhes das demais vantagens em suas descrições.</div>`;}
function emptyState(icon,title,desc,button=''){return `<div class="empty"><div class="empty-icon">${ico(icon)}</div><h3>${title}</h3><p>${desc}</p>${button}</div>`;}
function renderPowers(c,calc){const q=norm(ui.powerSearch),ordered=[];for(const p of c.powers.filter(p=>!p.parentId)){ordered.push(p,...c.powers.filter(a=>a.parentId===p.id));}const list=ordered.filter(p=>norm(p.name+' '+p.descriptor+' '+p.effects.map(e=>(e.label||'')+' '+e.type).join(' ')).includes(q));return `${pageHeading('04','Poderes & efeitos','Crie poderes com efeitos básicos, modificadores e alternativas. A ficha calcula o custo de cada construção.',actionButton('new-power','Criar poder','plus','','primary no-print'))}<div class="toolbar no-print"><input type="search" id="power-search" value="${esc(ui.powerSearch)}" placeholder="Buscar poder, efeito ou descritor…" aria-label="Buscar poder"><span class="badge accent">${fmt(calc.breakdown.powers)} PP em poderes</span></div>${list.length?`<div class="item-list">${list.map(p=>{const isActive=calc.active.some(a=>a.id===p.id),root=p.parentId?c.powers.find(a=>a.id===p.parentId):p,alts=c.powers.filter(a=>a.parentId===p.id),raw=powerRaw(p),cost=p.parentId?num(p.alternateCost,1):powerGroupCost(c,p);return `<article class="list-card power-card ${p.parentId?'is-alternate':''} ${isActive?'':'inactive'}"><div class="power-inner"><div class="power-header"><div class="power-symbol">${ico(p.parentId?'copy':'bolt')}</div><div class="power-title"><h3>${esc(p.name)}</h3><small>${p.parentId?'Alternativa de '+esc(root?.name||'arranjo'):alts.length?'Poder base · '+alts.length+' alternativa(s)':'Poder independente'}${p.descriptor?' · '+esc(p.descriptor):''}</small></div><div class="power-cost">${fmt(cost)}<small>${p.parentId?'PP · ALTERNATIVO':alts.length?'PP · ARRANJO':'PONTOS DE PODER'}</small></div></div><div class="effect-tags">${p.effects.map(e=>`<span class="effect-tag">${e.label&&p.effects.length>1?esc(e.label)+' · ':''}${esc(e.type)} ${e.rank}${e.area?' · Área':''}${e.range==='À distância'?' · Distância':e.range==='Percepção'?' · Percepção':''}</span>`).join('')}${p.removable?`<span class="badge">${p.removable===2?'Facilmente removível':'Removível'}</span>`:''}${p.manualCost!==null?'<span class="badge warn">Custo manual</span>':''}${isActive?'<span class="badge good">Em uso</span>':''}</div>${p.description?`<p style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.description)}</p>`:''}<details class="power-details"><summary>Ver construção · ${fmt(raw)} PP em efeitos</summary>${p.effects.map(e=>`<div class="effect-detail"><strong>${e.label?esc(e.label)+' · ':''}${esc(e.type)} ${e.rank} · ${fmt(effectCost(e))} PP</strong><p>${esc(e.action)} · ${esc(e.range)} · ${esc(e.duration)}${e.resist!=='Nenhuma'?' · '+esc(e.resist):''}${e.area?' · Área (+1/grad.)':''}${e.strBased?' · Baseado em Força':''}<br>${e.mods.map(m=>`${esc(m.name)} (${signed(m.value)} ${m.kind==='rank'?'/grad.':'fixo'})`).join('; ')||'Sem modificadores adicionais.'}${e.notes?'<br>'+esc(e.notes):''}</p></div>`).join('')}</details></div><div class="power-footer"><div class="row wrap">${!p.parentId&&alts.length?`<label class="check-line"><input type="checkbox" data-power-toggle="${p.id}" ${p.enabled?'checked':''}>Arranjo ativo</label>`:''}${p.parentId||alts.length?`<button type="button" class="btn small ${isActive?'primary':'ghost'}" data-action="activate-power" data-id="${p.id}" ${isActive?'disabled':''}>${ico(isActive?'check':'bolt')}${isActive?'Selecionado':p.parentId?'Usar alternativa':'Usar poder base'}</button>`:`<label class="check-line"><input type="checkbox" data-power-toggle="${p.id}" ${p.enabled?'checked':''}>Poder ativo</label>`}</div><div class="row">${!p.parentId?actionButton('new-alternate','Alternativa','plus',`data-id="${p.id}"`,'small no-print'):''}${iconButton('edit-power','Editar poder','edit',`data-id="${p.id}"`)}${iconButton('delete-power','Remover poder','trash',`data-id="${p.id}"`)}</div></div></article>`;}).join('')}</div>`:c.powers.length?emptyState('bolt','Nenhum poder encontrado','Tente outro nome, efeito ou descritor.'):emptyState('bolt','O que torna seu herói extraordinário?','Comece com um efeito básico ou use um modelo como Raio, Campo de Força ou Telecinese.',actionButton('new-power','Montar primeiro poder','plus','','primary no-print'))}<p class="hint" style="margin-top:17px">Alternativas simples custam +1 PP e usam o orçamento do poder base. Selecione uma de cada arranjo para aplicar os bônus à ficha. Construções dinâmicas ou modificadores parciais podem ser registrados pelo custo manual, com os detalhes na descrição.</p>`;}
function renderDossier(c,calc){const v=validation(c,calc);return `${pageHeading('06','Além da máscara','História, complicações e recursos que dão vida ao personagem.')}<div class="stack"><section class="panel">${panelHead('01','Complicações',actionButton('add-complication','Adicionar','plus','','small no-print'))}${c.complications.length?`<div class="item-list">${c.complications.map(x=>`<article class="list-card complication-card"><div class="list-card-title"><div><div class="eyebrow">${esc(x.type)}</div><h3>${esc(x.name)}</h3></div><div class="card-actions">${iconButton('edit-complication','Editar complicação','edit',`data-id="${x.id}"`)}${iconButton('delete-complication','Remover complicação','trash',`data-id="${x.id}"`)}</div></div><p>${esc(x.notes)}</p></article>`).join('')}</div>`:'<p class="hint">Registre a motivação e as dificuldades do personagem. Complicações não reduzem o custo em PP; podem render pontos heroicos quando entram em cena.</p>'}</section><section class="panel">${panelHead('02','História & identidade')}<div class="grid cols2">${textField('História','history',c.history,'De onde veio? O que transformou sua vida?')}${textField('Personalidade','personality',c.personality,'Como age, no que acredita, o que teme…')}${textField('Aparência','appearance',c.appearance,'Uniforme, traços marcantes e identidade visual…')}${textField('Aliados, rivais e vínculos','allies',c.allies,'Pessoas e lugares importantes para a história.')}</div></section><section class="panel">${panelHead('03','Equipamento',actionButton('add-equipment','Adicionar item','plus','','small no-print'))}<div class="row between" style="margin-bottom:18px"><p class="hint">Vantagem Equipamento ${advantageRanks(c,'Equipamento')} × 5 PE.</p><span class="badge ${v.equipSpent>v.equipBudget?'bad':'accent'}">${fmt(v.equipSpent)} / ${v.equipBudget} PE</span></div>${c.equipment.length?`<div class="item-list">${c.equipment.map(e=>`<div class="list-card equipment-row"><div><h3>${esc(e.name)}${e.quantity>1?' ×'+e.quantity:''}</h3><p>${esc(e.notes)}</p></div><div class="equipment-cost">${fmt(e.cost*e.quantity)}<small class="muted" style="font-size:9px;display:block">PE</small></div>${iconButton('edit-equipment','Editar item','edit',`data-id="${e.id}"`)}</div>`).join('')}</div>`:'<p class="hint">Adicione armas, proteção, veículos e outros recursos comprados com PE. Dispositivos especiais podem ser construídos como poderes removíveis.</p>'}<p class="hint" style="margin-top:13px">Os itens registram custo e descrição. Transfira seus bônus para os ajustes da ficha; os PE são pagos pela vantagem Equipamento.</p></section><section class="panel">${panelHead('04','Anotações')}${textField('Diário / notas livres','notes',c.notes,'Acontecimentos da campanha, objetivos e próximos passos…')}</section>${renderImportedData(c)}</div>`;}
function openDialog(title,body,footer='',mode=''){ui.dialogMode=mode;$('dialog').innerHTML=`<header class="dialog-header"><div><div class="eyebrow">Arquivo de Heróis</div><h2 id="dialog-title">${title}</h2></div>${iconButton('close-dialog','Fechar','close')}</header><div class="dialog-body">${body}</div>${footer?'<footer class="dialog-footer">'+footer+'</footer>':''}`;if(!$('dialog').open){if(typeof $('dialog').showModal==='function')$('dialog').showModal();else $('dialog').setAttribute('open','');}}
function closeDialog(){if(typeof $('dialog').close==='function')$('dialog').close();else $('dialog').removeAttribute('open');ui.dialogMode='';ui.confirmed=null;}
function confirmAction(title,message,callback,label='Confirmar'){ui.confirmed=callback;openDialog(title,`<p class="small-text" style="line-height:1.8">${esc(message)}</p>`,actionButton('close-dialog','Cancelar')+actionButton('confirm',label,'','','primary'),'confirm');}
function openNewCharacter(){openDialog('Novo personagem',`<div class="stack"><label><span>Nome do personagem</span><input id="new-name" placeholder="Como seu herói será conhecido?" maxlength="180" autocomplete="off"></label><div class="grid cols2"><label><span>Nível de poder</span><input id="new-np" type="number" value="10" min="1" max="100"></label><label><span>Tipo</span><select id="new-role">${selectOptions(['Herói','Vilão','Anti-herói','Aliado','NPC'],'Herói')}</select></label></div><div class="note">A ficha começa com NP × 15 PP. Você pode mudar o orçamento depois.</div></div>`,actionButton('close-dialog','Cancelar')+actionButton('create-character','Criar ficha','plus','','primary'),'new-character');}
function openCharacterOptions(){const c=current();openDialog('Gerenciar personagem',`<div class="stack"><p class="hint">${esc(c.name)} · NP ${c.np} · ${esc(c.role)}</p>${actionButton('duplicate-character','Duplicar ficha','copy')}${actionButton('archive-character',c.archived?'Restaurar aos personagens ativos':'Arquivar personagem','archive')}${actionButton('delete-character','Excluir personagem','trash','','danger')}<p class="hint">Arquivar mantém o personagem salvo. Excluir remove esta ficha da coleção; exporte uma cópia se quiser guardá-la.</p></div>`,'','character-options');}
function openExportOptions(){const c=current();openDialog('Levar sua ficha com você',`<div class="stack">${actionButton('export-character','Exportar este personagem · JSON','download')}${actionButton('export-collection','Exportar toda a coleção · JSON','download')}${actionButton('download-html','Baixar HTML com a coleção atual','download','','primary')}${actionButton('print','Imprimir ficha / salvar como PDF','print')}<div class="note">JSON serve como cópia de segurança. O botão Importar também aceita arquivos de personagem ou portfólio do Poder Supremo. O HTML leva o aplicativo e os personagens juntos, para abrir em outro computador. O salvamento automático fica no navegador em que você está usando.</div></div>`,'','export');}
function openHelp(){openDialog('Sua ficha, passo a passo',`<div class="stack small-text"><p><strong>1. Personagem.</strong> Defina nome, NP, orçamento e habilidades. Valores negativos devolvem pontos; habilidades ausentes seguem o custo de −10 PP e exigem aplicar suas regras na mesa.</p><p><strong>Importação.</strong> O botão Importar aceita os JSON desta ficha e do Poder Supremo. Portfólios com vários personagens são convertidos de uma vez; fotos e registros de evolução ficam no Dossiê.</p><p><strong>2. Perícias e vantagens.</strong> Distribua graduações, adicione especializações e escolha seus talentos. Os totais são calculados a partir das habilidades.</p><p><strong>3. Poderes.</strong> Combine efeitos, altere alcance e adicione extras e falhas. Área e alcance alteram o custo automaticamente. Para ajustes de ação, duração e outras regras, adicione os modificadores correspondentes.</p><p><strong>4. Combate.</strong> Consulte suas ofensivas, acompanhe condições e registre bônus temporários. As defesas permanentes são editadas em Personagem; pontos e limites ficam na construção. Os dados têm rolagem local.</p><p><strong>5. Dossiê.</strong> Guarde história, complicações e equipamentos.</p><div class="note"><strong>Guarde uma cópia.</strong> Use Exportar para baixar JSON ou um HTML preenchido. O armazenamento local pode ser bloqueado em alguns navegadores ou apagado ao limpar os dados.</div><p class="hint">Base de regras: os livros M&M 3ª edição e Perfis de Poder fornecidos. Esta ficha é uma ferramenta pessoal e independente. Custos e limites são auxiliares; regras situacionais e construções especiais continuam sendo conferidas com o mestre.</p></div>`,actionButton('close-dialog','Entendi','','','primary'),'help');}
function openSpecialty(id=''){const s=current().skills.find(s=>s.id===id);ui.editId=id;openDialog(s?'Editar especialização':'Nova especialização',`<div class="stack"><label><span>Categoria</span><select id="specialty-kind">${selectOptions(Object.entries(SPECIALTIES).map(([k,v])=>[k,v[0]]),s?.kind||'close')}</select></label><label><span>Especialização</span><input id="specialty-name" value="${esc(s?.name?.split(':').slice(1).join(':').trim()||'')}" placeholder="Ex.: Desarmado, Arcos, Magia, Ciência…" maxlength="150"></label><div class="grid cols3"><label><span>Graduações</span><input id="specialty-ranks" type="number" min="0" max="200" value="${s?.ranks||0}"></label><label><span>Habilidade</span><select id="specialty-attr">${selectOptions(ATTRS.map(a=>[a[0],a[1]]),s?.attr||'lut')}</select></label><label><span>Bônus manual</span><input id="specialty-bonus" type="number" min="-200" max="200" value="${s?.bonus||0}"></label></div><label class="check-line"><input id="specialty-trained" type="checkbox" ${s?.trained?'checked':''}>Exige treinamento</label></div>`,(s?actionButton('delete-specialty','Remover','trash','','danger'):'')+actionButton('close-dialog','Cancelar')+actionButton('save-specialty','Salvar','','','primary'),'specialty');}
function openAdvantageCatalog(){openDialog('Escolher uma vantagem',`<div class="grid cols2"><input id="advantage-search" type="search" placeholder="Buscar uma vantagem…" aria-label="Buscar vantagem"><select id="advantage-category" aria-label="Categoria da vantagem">${selectOptions(['Todas','Combate','Perícia','Sorte','Geral'],'Todas')}</select></div><div id="advantage-catalog-list" class="catalog-list"></div>`,actionButton('custom-advantage','Criar vantagem personalizada','plus'),'advantage-catalog');renderAdvantageCatalog();}
function renderAdvantageCatalog(){const q=norm($('advantage-search')?.value||''),cat=$('advantage-category')?.value||'Todas';const list=ADVANTAGES.filter(a=>norm(a[0]).includes(q)&&(cat==='Todas'||a[1]===cat));$('advantage-catalog-list').innerHTML=list.map(a=>`<button class="catalog-item" data-action="choose-advantage" data-value="${esc(a[0])}"><div><strong>${esc(a[0])}</strong><p>${esc(a[1])} · ${a[2]===1?'Única':'Graduada'} · ${esc(a[3])}</p></div>${ico('plus')}</button>`).join('')||'<p class="hint">Nenhuma vantagem encontrada.</p>';}
function openAdvantage(name='',id=''){const a=current().advantages.find(a=>a.id===id),def=ADVANTAGES.find(a=>a[0]===name);ui.editId=id;openDialog(a?'Editar vantagem':'Adicionar vantagem',`<div class="stack"><label><span>Nome</span><input id="adv-name" value="${esc(a?.name||name)}" maxlength="180"></label><label><span>Graduação · 1 PP cada</span><input id="adv-rank" type="number" min="1" max="200" value="${a?.rank||1}"></label><label><span>Escolhas e detalhes</span><textarea id="adv-notes" maxlength="30000" placeholder="Especialidade, uso, alvo ou benefício escolhido…">${esc(a?.notes||def?.[3]||'')}</textarea></label></div>`,actionButton('close-dialog','Cancelar')+actionButton('save-advantage','Salvar vantagem','','','primary'),'advantage');}
function powerTemplates(){return `<div class="template-grid">${[['Raio','bolt'],['Bola de Raios','bolt'],['Campo de Força','shield'],['Telecinese','target'],['Voo','bolt'],['Pele Resistente','shield']].map(([s,i])=>`<button type="button" class="template-btn" data-action="power-template" data-value="${s}">${ico(i)}${s}</button>`).join('')}</div>`;}
function openPower(id='',parentId=''){const p=current().powers.find(x=>x.id===id);ui.draft=p?clone(p):createPower();ui.editId=id;if(parentId)ui.draft.parentId=parentId;renderPowerDialog(true);}
function draftField(label,key,value,type='text',extra=''){return `<label><span>${label}</span><input data-draft="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function draftSelect(label,key,value,options){return `<label><span>${label}</span><select data-draft="${key}">${selectOptions(options,value)}</select></label>`;}
function renderPowerDialog(initial=false){const p=ui.draft,c=current();if(!p)return;const roots=c.powers.filter(r=>!r.parentId&&r.id!==p.id);const body=`${!ui.editId&&!p.parentId?`<details><summary class="small-text" style="cursor:pointer;font-weight:750">Começar com um modelo</summary>${powerTemplates()}</details><div class="sep"></div>`:''}<div class="grid cols2">${draftField('Nome do poder','name',p.name,'text','maxlength="180"')}${draftField('Descritores','descriptor',p.descriptor,'text','placeholder="Ex.: elétrico, mágico, tecnológico…" maxlength="500"')}<label class="span2"><span>Descrição / funcionamento</span><textarea data-draft="description" maxlength="30000" placeholder="Como se manifesta? Quais são suas regras e limitações?">${esc(p.description)}</textarea></label>${draftSelect('Arranjo / alternativa','parentId',p.parentId,[['','Poder independente / base'],...roots.map(r=>[r.id,'Alternativa de '+r.name])])}${draftSelect('Dispositivo removível','removable',p.removable,[['0','Não removível'],['1','Removível · −1 a cada 5 PP'],['2','Facilmente removível · −2 a cada 5 PP']])}</div><div id="builder-effects">${p.effects.map((e,i)=>renderEffectBuilder(e,i,c)).join('')}</div><div class="row wrap" style="margin-top:16px">${actionButton('add-effect','Adicionar efeito','plus','','small')}${actionButton('add-modifier-help','Como o custo funciona','info','','small ghost')}</div><details style="margin-top:19px"><summary class="small-text" style="cursor:pointer;font-weight:750">Custo manual para construções especiais</summary><div style="margin-top:12px">${draftField('Custo completo antes de Removível (opcional)','manualCost',p.manualCost??'','number','min="1" max="100000" step="1" placeholder="Deixe vazio para calcular"')}<p class="builder-note">Substitui a soma dos efeitos. Use para modificadores que afetam só parte das graduações, arranjos dinâmicos e outras construções já conferidas com o mestre.</p></div></details><p class="builder-note">Alcance e graduações de Área entram automaticamente no custo. O tamanho da área depende do extra Área, não da graduação do dano. Ação e duração são campos de registro: acrescente os extras e falhas correspondentes. Os modificadores por graduação se aplicam a todas as graduações do efeito.</p>`;
 openDialog(ui.editId?'Editar poder':p.parentId?'Criar efeito alternativo':'Construir um poder',body,`<span class="cost-live" id="power-cost-live"></span>${actionButton('close-dialog','Cancelar')}${actionButton('save-power','Salvar poder','check','','primary')}`,'power');updatePowerCost();if(!initial){} }
function renderEffectBuilder(e,index,c){const choices=[['','Não aplicar automaticamente'],...ATTRS.map(a=>[a[0],a[1]+' aumentada']),...DEFENSES.map(d=>[d[0],d[1]+' aumentada']),['initiative','Iniciativa aumentada']];return `<section class="builder-effect"><div class="builder-effect-head"><strong>${e.label?esc(e.label):'Efeito '+(index+1)}</strong><span class="effect-price" id="effect-price-${e.id}">${fmt(effectCost(e))} PP</span>${iconButton('remove-effect','Remover efeito','trash',`data-id="${e.id}"`)}</div><div class="builder-effect-body"><label style="margin-bottom:12px"><span>Nome deste efeito (opcional)</span><input data-effect="${e.id}" data-key="label" value="${esc(e.label||'')}" maxlength="180"></label><div class="builder-fields">${effectSelect(e,'Efeito básico','type',e.type,Object.keys(EFFECTS))}${effectInput(e,'Graduação','rank',e.rank,'min="0" max="200"')}${effectInput(e,'PP / grad. base','base',e.base,'min="1" max="100"')}</div><div class="builder-metadata">${effectSelect(e,'Alcance','range',e.range,['Pessoal','Perto','À distância','Percepção','Graduação'])}${effectSelect(e,'Ação','action',e.action,['Nenhuma','Livre','Reação','Movimento','Padrão','Rodada completa'])}${effectSelect(e,'Duração','duration',e.duration,['Instantânea','Concentração','Sustentada','Contínua','Permanente'])}${effectSelect(e,'Resistido por','resist',e.resist,['Nenhuma','Resistência','Fortitude','Vontade','Esquiva','Força','Prontidão','Oposto'])}<label style="grid-column:span 2"><span>Aplicar bônus à ficha enquanto ativo</span><select data-effect="${e.id}" data-key="apply">${selectOptions(choices,e.apply)}</select></label></div><div class="row wrap" style="margin-top:15px"><label class="check-line"><input type="checkbox" data-effect="${e.id}" data-key="enabled" ${e.enabled!==false?'checked':''}>Efeito ativo</label><label class="check-line"><input type="checkbox" data-effect="${e.id}" data-key="attack" ${e.attack?'checked':''}>Efeito ofensivo</label><label class="check-line"><input type="checkbox" data-effect="${e.id}" data-key="area" ${e.area?'checked':''}>Área</label>${e.type==='Dano'?`<label class="check-line"><input type="checkbox" data-effect="${e.id}" data-key="strBased" ${e.strBased?'checked':''}>Somar Força ao dano</label>`:''}</div>${e.attack?`<div class="grid cols3" style="margin-top:15px">${effectSelect(e,'Base do ataque','attackMode',e.attackMode,[['close','Luta · corpo a corpo'],['ranged','Destreza · distância']])}${effectSelect(e,'Especialização','skillId',e.skillId,[['','Apenas habilidade + vantagem'],...c.skills.filter(s=>s.kind===e.attackMode).map(s=>[s.id,s.name])])}${effectInput(e,'Ajuste de ataque','accuracy',e.accuracy,'min="-200" max="200"')}</div><p class="builder-note">Acurado soma +2 ao ataque por ponto do modificador. Área e percepção dispensam teste de ataque.</p>`:''}${areaBuilder(e)}${e.attack?degreeBuilder(e):''}<div class="builder-mods">${e.mods.map(m=>`<div class="mod-row"><label><span class="sr-only">Nome do modificador</span><input data-mod="${m.id}" data-effect="${e.id}" data-key="name" value="${esc(m.name)}" maxlength="180" placeholder="Nome do extra / falha"></label><label><span class="sr-only">Tipo de custo</span><select data-mod="${m.id}" data-effect="${e.id}" data-key="kind">${selectOptions([['rank','Por grad.'],['flat','Fixo']],m.kind)}</select></label><label><span class="sr-only">Valor do modificador</span><input type="number" data-mod="${m.id}" data-effect="${e.id}" data-key="value" value="${m.value}" min="-200" max="200"></label>${iconButton('remove-modifier','Remover modificador','close',`data-id="${m.id}" data-effect-id="${e.id}"`)}</div>`).join('')}</div><div class="row" style="margin-top:11px"><select class="small-text" data-mod-picker="${e.id}" aria-label="Escolher extra ou falha"><option value="">Adicionar extra ou falha…</option>${MODIFIERS.map((m,i)=>`<option value="${i}">${esc(m[0])} · ${signed(m[2])} ${m[1]==='rank'?'/ grad.':'fixo'}</option>`).join('')}</select></div><label style="margin-top:15px"><span>Detalhes do efeito / condições da Aflição</span><textarea data-effect="${e.id}" data-key="notes" maxlength="30000" style="min-height:65px" placeholder="Condições por grau, escolha de sentidos, imunidades, limitações…">${esc(e.notes)}</textarea></label></div></section>`;}
function effectInput(e,label,key,value,extra=''){return `<label><span>${label}</span><input type="number" data-effect="${e.id}" data-key="${key}" value="${esc(value)}" ${extra}></label>`;}
function effectSelect(e,label,key,value,options){return `<label><span>${label}</span><select data-effect="${e.id}" data-key="${key}">${selectOptions(options,value)}</select></label>`;}
function updatePowerCost(){const p=ui.draft;if(!p||!$('power-cost-live'))return;const raw=powerRaw(p);const group=raw+num(p.arrayBaseSurcharge)+current().powers.filter(a=>a.parentId===p.id).reduce((n,a)=>n+num(a.alternateCost,1),0);let value=group-Math.ceil(group/5)*num(p.removable);if(p.parentId)value=num(p.alternateCost,1);$('power-cost-live').innerHTML=`<strong>${fmt(Math.max(1,value))}</strong> PP${p.parentId?` · ${fmt(raw)} PP em efeitos`:''}`;for(const e of p.effects){const area=$('area-size-'+e.id);if(area&&e.area)area.textContent=areaDetails(e,e.rank).text;const el=$('effect-price-'+e.id);if(el)el.textContent=fmt(effectCost(e))+' PP';}}
function applyTemplate(name){const p=ui.draft;let e=createEffect('Dano',10);p.name=name;p.descriptor='';p.description='';if(name==='Raio'){e.range='À distância';e.attackMode='ranged';p.descriptor='Energia';}if(name==='Bola de Raios'){e.range='À distância';e.attackMode='ranged';e.area=true;p.descriptor='Elétrico';}if(name==='Campo de Força'){e=createEffect('Proteção',8);e.duration='Sustentada';e.action='Livre';p.descriptor='Energia';}if(name==='Telecinese'){e=createEffect('Mover Objeto',8);p.descriptor='Mental';}if(name==='Voo')e=createEffect('Voo',6);if(name==='Pele Resistente'){e=createEffect('Proteção',8);e.mods=[{id:uid(),name:'Impenetrável',kind:'rank',value:1}];}p.effects=[e];p.manualCost=null;renderPowerDialog();}
function openEntry(kind,id=''){const c=current();ui.editId=id;let title,body;if(kind==='equipment'){const e=c.equipment.find(x=>x.id===id);title=e?'Editar equipamento':'Adicionar equipamento';body=`<div class="stack"><label><span>Nome do item</span><input id="entry-name" value="${esc(e?.name||'')}" maxlength="180"></label><div class="grid cols2"><label><span>Custo em PE por unidade</span><input id="entry-cost" type="number" min="0" max="100000" value="${e?.cost||0}"></label><label><span>Quantidade</span><input id="entry-quantity" type="number" min="1" max="999" value="${e?.quantity||1}"></label></div><label><span>Descrição, efeitos e características</span><textarea id="entry-notes" maxlength="30000">${esc(e?.notes||'')}</textarea></label></div>`;}else{const x=c.complications.find(x=>x.id===id);title=x?'Editar complicação':'Adicionar complicação';body=`<div class="stack"><label><span>Título</span><input id="entry-name" value="${esc(x?.name||'')}" maxlength="180" placeholder="O que torna a vida do personagem difícil?"></label><label><span>Tipo</span><select id="entry-type">${selectOptions(['Motivação','Identidade','Relacionamento','Responsabilidade','Fraqueza','Inimigo','Segredo','Reputação','Preconceito','Outra complicação'],x?.type||'Motivação')}</select></label><label><span>Como entra em cena</span><textarea id="entry-notes" maxlength="30000">${esc(x?.notes||'')}</textarea></label></div>`;}openDialog(title,body,(id?actionButton('delete-entry','Remover','trash','','danger'):'')+actionButton('close-dialog','Cancelar')+actionButton('save-entry','Salvar','','','primary'),kind);}
function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function safeFilename(name){return norm(name).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,90)||'personagem';}
function exportJSON(all=false){persist();const obj={schema:APP_SCHEMA,format:1,exported:new Date().toISOString(),theme:app.theme,activeId:app.activeId,characters:all?app.characters:[current()]};downloadFile((all?'colecao_mm3':safeFilename(current().name)+'_mm3')+'.json',JSON.stringify(obj,null,2),'application/json');notify('Cópia JSON preparada para download.');}
function downloadHTML(){persist();const doc=document.documentElement.cloneNode(true);doc.querySelector('#boot-data').textContent=JSON.stringify({...app,instanceId:uid(),activeId:app.activeId}).replace(/</g,'\\u003c');const dialog=doc.querySelector('#dialog');dialog.removeAttribute('open');dialog.innerHTML='';doc.querySelector('#toast').classList.remove('show');doc.querySelector('#toast').textContent='';doc.querySelector('body').classList.remove('sidebar-collapsed');downloadFile('ficha_mutantes_malfeitores.html','<!DOCTYPE html>\n'+doc.outerHTML,'text/html;charset=utf-8');notify('HTML preparado com a coleção atual.');}
async function importJSON(file){
 if(!file)return;if(file.size>35*1024*1024){notify('Arquivo grande demais. Use um JSON de até 35 MB.');return;}
 try{
  if(ui.loading)throw Error('Aguarde a recuperação das fichas salvas.');
  const source=JSON.parse((await file.text()).replace(/^\uFEFF/,''));let chars,external=false;
  if(source?.schema===APP_SCHEMA){if(!Array.isArray(source.characters)||!source.characters.length)throw Error('O arquivo não contém personagens.');if(source.characters.length>200)throw Error('Importe até 200 personagens por arquivo.');chars=source.characters.map(sanitizeCharacter);chars.forEach(c=>{if(!c.visual)c.visual=cleanVisual({theme:source.theme});});}
  else{const entries=psEntries(source);if(!entries)throw Error('Formato não reconhecido. Selecione um JSON desta ficha ou do Poder Supremo.');external=true;chars=entries.map(c=>convertPoderSupremo(c,source.portName||source.portfolio?.portName||'',file.name||''));}
  if(app.characters.length+chars.length>200)throw Error('A coleção aceita até 200 fichas. Exporte e organize uma coleção menor.');
  for(const c of chars){if(app.characters.some(a=>a.id===c.id)){c.id=uid();c.name+=' (importado)';}app.characters.push(c);}
  app.activeId=chars[0].id;ui.collection=chars[0].archived?'archived':'active';ui.search='';$('character-search').value='';ui.tab='overview';persist();render();if(ui.storagePending)await ui.storagePromise;
  notify(chars.length+' ficha(s) importada(s)'+(external?' do Poder Supremo.':'.'));
  if(external)openDialog('Importação concluída',`<div class="stack"><p class="small-text">${chars.length} personagem(ns) do Poder Supremo importado(s).</p>${chars.map(c=>{const x=calculations(c);return `<div class="readout"><span>${esc(c.name)} · NP ${c.np}</span><strong>${fmt(x.spent)} / ${fmt(x.budget)} PP</strong><p class="hint">${c.advantages.length} vantagens · ${c.powers.length} poderes / alternativas · ${c.gallery.length} imagens</p></div>`;}).join('')}<p class="hint">Poderes, arranjos, modificadores e registros de evolução estão na ficha. As observações da conversão e a galeria ficam no Dossiê.</p>${!ui.storageOK?'<div class="note">O navegador não permitiu salvar os dados. Exporte JSON ou HTML antes de fechar para guardar as fichas.</div>':''}</div>`,actionButton('close-dialog','Abrir ficha','','','primary'),'import-result');
 }catch(err){notify('Não foi possível importar: '+err.message);}finally{$('json-input').value='';}
}

function portraitUpload(file){if(!file)return;const targetId=app.activeId;if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>15*1024*1024){notify('Escolha uma imagem PNG, JPG, WEBP ou GIF de até 15 MB.');return;}const reader=new FileReader();reader.onerror=()=>notify('Não foi possível ler a imagem.');reader.onload=()=>{const img=new Image();img.onerror=()=>notify('Não foi possível abrir esta imagem.');img.onload=()=>{const factor=Math.min(1,1400/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*factor));canvas.height=Math.max(1,Math.round(img.height*factor));const ctx=canvas.getContext('2d');if(!ctx){notify('O navegador não permitiu preparar a imagem.');return;}ctx.fillStyle='#f5f2eb';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const c=app.characters.find(c=>c.id===targetId);if(!c)return;c.portrait=canvas.toDataURL('image/jpeg',.84);c.updated=new Date().toISOString();persist();render();notify('Retrato adicionado.');};img.src=reader.result;};reader.readAsDataURL(file);$('portrait-input').value='';}
function d20(){if(globalThis.crypto?.getRandomValues){const arr=new Uint32Array(1),max=4294967280;do{crypto.getRandomValues(arr);}while(arr[0]>=max);return arr[0]%20+1;}return Math.floor(Math.random()*20)+1;}
function roll(label,bonus,attack=false,critical=20){if(bonus===null)return;const c=current(),die=d20(),total=die+bonus;c.log.push({label,die,bonus,total,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});c.log=c.log.slice(-30);touch(true);openDialog(esc(label),`<div class="roll-result"><div class="roll-die"><strong>${die}</strong></div><div class="roll-formula">d20 (${die}) ${signed(bonus)}</div><div class="roll-grand-total">${fmt(total)}</div>${attack&&die>=critical?'<span class="badge accent">'+die+' natural · ameaça de crítico</span>':attack&&die===1?'<span class="badge warn">1 natural · falha no ataque</span>':''}</div>`,actionButton('close-dialog','Concluir','','','primary'),'roll');}
function printSheet(){closeDialog();document.querySelectorAll('.print-text').forEach(el=>{const prev=el.previousElementSibling;el.textContent=prev?.value||'';el.hidden=false;});const details=[...document.querySelectorAll('.power-details,.degree-details')];details.forEach(d=>{d.dataset.wasOpen=d.open?'1':'0';d.open=true;});const restore=()=>{details.forEach(d=>{d.open=d.dataset.wasOpen==='1';});document.querySelectorAll('.print-text').forEach(el=>el.hidden=true);window.removeEventListener('afterprint',restore);};window.addEventListener('afterprint',restore);window.print();}
// Eventos delegados preservam o foco dos campos durante a edição.
function handleField(el){const c=current(),path=el.dataset.field;if(!path)return;let value=el.type==='number'?num(el.value):el.value;if(path.startsWith('abilities.'))value=integer(value,-5,200);if(path.startsWith('defenses.'))value=integer(value,0,200);if(path.startsWith('bonuses.'))value=integer(value,-200,200);if(path==='np')value=integer(value,1,100,10);if(path==='budget'||path==='earned')value=bounded(value,0,100000);if(path==='budget'&&c.budgetMode==='auto')value=c.np*15;if(path==='budgetMode')value=value==='manual'?'manual':'auto';setAt(c,path,value);if((path==='np'||path==='budgetMode')&&c.budgetMode==='auto')c.budget=c.np*15;touch();refreshComputed();}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.visual){updateVisualInput(el);return;}if(el.dataset.field){handleField(el);return;}if(el.id==='character-search'){ui.search=el.value;renderCollection();return;}if(el.id==='skill-search'){ui.skillSearch=el.value;updateSkillResults();return;}if(el.id==='power-search'){ui.powerSearch=el.value;updatePowerResults();return;}if(el.id==='advantage-search'){renderAdvantageCatalog();return;}if(el.dataset.skill){const s=current().skills.find(s=>s.id===el.dataset.skill);if(s){s[el.dataset.key]=integer(el.value,el.dataset.key==='ranks'?0:-200,200);touch();refreshComputed();}return;}if(el.dataset.advantage){const a=current().advantages.find(a=>a.id===el.dataset.advantage);if(a){a.rank=integer(el.value,1,200,1);touch();refreshComputed();}return;}if(ui.dialogMode==='power')handleDraftInput(el,false);});
function refreshComputed(){
 const c=current(),calc=calculations(c);$('breadcrumb-name').textContent=c.name||'Novo herói';document.title=(c.name||'Novo herói')+' · M&M';$('footer-summary').textContent=`NP ${c.np} · ${fmt(calc.spent)} / ${fmt(calc.budget)} PP`;renderCollection();
 if(ui.tab==='overview'){
  const page=$('page-overview'),temp=document.createElement('template');temp.innerHTML=renderOverview(c,calc);
  for(const sel of ['.overview-side','.defense-list','.identity-top']){const target=page.querySelector(sel),source=temp.content.querySelector(sel);if(target&&source)target.innerHTML=source.innerHTML;}
  const budgetField=page.querySelector('[data-field="budget"]');if(budgetField){budgetField.readOnly=c.budgetMode==='auto';budgetField.parentElement.querySelector('span').textContent=c.budgetMode==='auto'?'PP iniciais · NP × 15':'PP iniciais · personalizado';if(c.budgetMode==='auto')budgetField.value=c.np*15;}const review=page.querySelector('.construction-review');if(review){const holder=document.createElement('template');holder.innerHTML=renderConstructionReview(c);review.innerHTML=holder.content.firstElementChild.innerHTML;}page.querySelectorAll('.ability-card').forEach((card,i)=>{const key=ATTRS[i][0],v=card.querySelector('.ability-value');v.textContent=signed(calc.attrs[key]);v.classList.toggle('enhanced',!!(calc.auto[key]||calc.temp[key]));});
 }else if(ui.tab==='skills'){
  const vals=[fmt(calc.ranks),fmt(calc.breakdown.skills)+' PP','+'+(c.np+10)];document.querySelectorAll('#page-skills .readout strong').forEach((el,i)=>el.textContent=vals[i]);
  for(const skill of c.skills){const btn=document.querySelector(`[data-action="roll-skill"][data-id="${skill.id}"]`);if(!btn)continue;const total=skillTotal(c,skill,calc);btn.textContent=signed(total);btn.disabled=!skillUsable(c,skill);btn.closest('.skill-row').classList.toggle('over-cap',total!==null&&total>c.np+10);}
 }else if(ui.tab==='advantages'){
  const total=document.querySelector('#page-advantages>.row>strong');if(total)total.textContent=fmt(calc.breakdown.advantages)+' PP investidos';
 }else if(ui.tab==='combat'){
  const temp=document.createElement('template');temp.innerHTML=renderCombat(c,calc);
  for(const sel of ['.combat-side','.offensive-list','#conditions-panel','#temporary-panel']){const target=document.querySelector('#page-combat '+sel),source=temp.content.querySelector(sel);if(target&&source)target.innerHTML=source.innerHTML;}

}
function updateVisualInput(el){const c=current();c.visual=cleanVisual(c.visual);c.visual[el.dataset.visual]=el.type==='checkbox'?el.checked:el.type==='range'?integer(el.value,0,100,35):el.value;if(el.dataset.visual==='theme'){c.visual.accent='';const picker=document.querySelector('[data-visual="accent"]');if(picker)picker.value=VISUAL_ACCENTS[c.visual.theme];}c.visual=cleanVisual(c.visual);applyVisual();if($('accent-label'))$('accent-label').textContent=c.visual.accent||'Cor do tema';touch();}
function updateSkillResults(){const el=$('skill-search'),focus=el===document.activeElement,pos=el?.selectionStart;$('page-skills').innerHTML=renderSkills(current(),calculations(current()));if(focus){$('skill-search').focus();if(typeof pos==='number')$('skill-search').setSelectionRange(pos,pos);}}
function updatePowerResults(){const el=$('power-search'),focus=el===document.activeElement,pos=el?.selectionStart;$('page-powers').innerHTML=renderPowers(current(),calculations(current()));if(focus){$('power-search').focus();if(typeof pos==='number')$('power-search').setSelectionRange(pos,pos);}}
document.addEventListener('change',event=>{const el=event.target,c=current();if(el.dataset.visual){updateVisualInput(el);return;}if(el.dataset.tempToggle){const modifier=c.temporary.find(m=>m.id===el.dataset.tempToggle);if(modifier)modifier.active=el.checked;touch(true);return;}if(el.id==='theme-select'){c.visual=cleanVisual(c.visual);c.visual.theme=THEMES.includes(el.value)?el.value:'rubro';c.visual.accent='';applyVisual();touch();return;}if(el.id==='json-input'){importJSON(el.files[0]);return;}if(el.id==='portrait-input'){portraitUpload(el.files[0]);return;}if(el.dataset.absent){c.abilities[el.dataset.absent]=el.checked?null:0;touch(true);return;}if(el.dataset.powerToggle){const p=c.powers.find(p=>p.id===el.dataset.powerToggle);if(p)p.enabled=el.checked;touch(true);return;}if(el.dataset.field){handleField(el);if(el.type==='number')el.value=getAt(c,el.dataset.field);return;}if(el.dataset.skill||el.dataset.advantage){if(el.dataset.skill){const entry=c.skills.find(s=>s.id===el.dataset.skill);if(entry)el.value=entry[el.dataset.key];}else{const entry=c.advantages.find(a=>a.id===el.dataset.advantage);if(entry)el.value=entry.rank;}refreshComputed();return;}if(el.id==='advantage-category'){renderAdvantageCatalog();return;}if(el.id==='specialty-kind'){const d=SPECIALTIES[el.value];$('specialty-attr').value=d[1];$('specialty-trained').checked=d[2];return;}if(ui.dialogMode==='power')handleDraftInput(el,true);});
function handleDraftInput(el,isChange){const p=ui.draft;if(!p)return;if(el.dataset.modPicker!==undefined&&isChange&&el.value!==''){const e=p.effects.find(x=>x.id===el.dataset.modPicker),m=MODIFIERS[Number(el.value)];if(e&&m){e.mods.push({id:uid(),name:m[0],kind:m[1],value:m[2]});renderPowerDialog();}return;}if(el.dataset.mod){const e=p.effects.find(x=>x.id===el.dataset.effect),m=e?.mods.find(x=>x.id===el.dataset.mod);if(m)m[el.dataset.key]=el.type==='number'?integer(el.value,-200,200):el.value;updatePowerCost();return;}if(el.dataset.draft){const key=el.dataset.draft;p[key]=key==='manualCost'?(el.value===''?null:integer(el.value,1,100000,1)):key==='removable'?integer(el.value,0,2):el.value;if(key==='parentId'&&isChange){if(p.parentId)p.removable=0;renderPowerDialog();}else updatePowerCost();return;}if(el.dataset.effect){const e=p.effects.find(x=>x.id===el.dataset.effect);if(!e)return;const key=el.dataset.key;if(el.dataset.degree!==undefined){if(!Array.isArray(e.degrees))e.degrees=['','','',''];e.degrees[integer(el.dataset.degree,0,3)]=el.value.slice(0,2000);return;}if(key==='type'&&isChange){const repl=createEffect(el.value,e.rank);Object.assign(e,repl,{id:e.id,notes:e.notes});renderPowerDialog();return;}e[key]=el.type==='checkbox'?el.checked:el.type==='number'?integer(el.value,key==='accuracy'?-200:key==='base'?1:0,key==='base'?100:200):el.value;if(key==='range'&&isChange){e.attackMode=el.value==='À distância'?'ranged':'close';e.skillId='';}if(key==='attackMode'&&isChange)e.skillId='';if(key==='apply'&&e.type==='Característica Aumentada'&&isChange&&e.apply&&e.apply!=='initiative'){e.base=ATTRS.some(a=>a[0]===e.apply)?2:1;renderPowerDialog();return;}if(isChange&&['attack','type','attackMode','range','area','areaShape'].includes(key))renderPowerDialog();else updatePowerCost();}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const act=button.dataset.action,id=button.dataset.id,value=button.dataset.value,c=current();
 switch(act){

 case'new-temporary':openTemporary();break;

 case'tab':if(TABS.some(t=>t[0]===value)){ui.tab=value;render();window.scrollTo({top:0,behavior:'smooth'});}break;

 case'new-character':if(app.characters.length>=200){notify('A coleção já tem 200 fichas. Exporte e organize uma coleção menor.');break;}openNewCharacter();break;
 case'create-character':{const char=createCharacter($('new-name').value.trim()||'Novo herói',integer($('new-np').value,1,100,10));char.role=$('new-role').value;app.characters.push(char);app.activeId=char.id;ui.collection='active';ui.tab='overview';ui.search='';$('character-search').value='';closeDialog();persist();render();notify('Nova ficha criada.');break;}

 case'duplicate-character':{if(app.characters.length>=200){notify('A coleção já tem 200 fichas.');break;}const copy=sanitizeCharacter(c);copy.id=uid();copy.name+=' (cópia)';copy.archived=false;app.characters.push(copy);app.activeId=copy.id;ui.collection='active';closeDialog();persist();render();notify('Ficha duplicada.');break;}

 case'add-specialty':openSpecialty();break;
 case'edit-specialty':openSpecialty(id);break;
 case'save-specialty':{const kind=$('specialty-kind').value,d=SPECIALTIES[kind],name=$('specialty-name').value.trim();if(!name){notify('Dê um nome à especialização.');break;}const entry={id:ui.editId||uid(),kind,name:d[0]+': '+name,attr:$('specialty-attr').value,trained:$('specialty-trained').checked,ranks:integer($('specialty-ranks').value,0,200),bonus:integer($('specialty-bonus').value,-200,200)};const i=c.skills.findIndex(s=>s.id===ui.editId);if(i>=0)c.skills[i]=entry;else c.skills.push(entry);closeDialog();touch(true);break;}
 case'delete-specialty':{const old=ui.editId;c.skills=c.skills.filter(s=>s.id!==old);for(const p of c.powers)for(const e of p.effects)if(e.skillId===old)e.skillId='';closeDialog();touch(true);break;}
 case'roll-skill':{const s=c.skills.find(s=>s.id===id);if(s&&skillUsable(c,s))roll(s.name,skillTotal(c,s));break;}
 case'advantage-catalog':openAdvantageCatalog();break;
 case'choose-advantage':openAdvantage(value);break;
 case'custom-advantage':openAdvantage();break;
 case'edit-advantage':openAdvantage('',id);break;
 case'save-advantage':{const name=$('adv-name').value.trim();if(!name){notify('Informe o nome da vantagem.');break;}const a={id:ui.editId||uid(),name,rank:integer($('adv-rank').value,1,200,1),notes:$('adv-notes').value};const i=c.advantages.findIndex(x=>x.id===ui.editId);if(i>=0)c.advantages[i]=a;else c.advantages.push(a);closeDialog();touch(true);break;}
 case'delete-advantage':c.advantages=c.advantages.filter(a=>a.id!==id);touch(true);break;
 case'new-power':openPower();break;
 case'edit-power':openPower(id);break;
 case'new-alternate':openPower('',id);break;
 case'power-template':applyTemplate(value);break;
 case'add-effect':ui.draft.effects.push(createEffect());renderPowerDialog();break;
 case'remove-effect':ui.draft.effects=ui.draft.effects.filter(e=>e.id!==id);renderPowerDialog();break;
 case'remove-modifier':{const e=ui.draft.effects.find(e=>e.id===button.dataset.effectId);if(e)e.mods=e.mods.filter(m=>m.id!==id);renderPowerDialog();break;}
 case'add-modifier-help':notify('Custo = graduações × custo por graduação, com extras, falhas e valores fixos. Abaixo de 1 PP/grad., usa frações; arredonda para cima.');break;
 case'save-power':{const p=ui.draft;if(!p.name.trim()){notify('Informe o nome do poder.');break;}if(!p.effects.length&&p.manualCost===null){notify('Adicione um efeito ou informe o custo manual.');break;}if(p.parentId&&c.powers.some(a=>a.parentId===p.id)){notify('Um poder base com alternativas não pode virar alternativa.');break;}if(p.parentId){p.removable=0;const root=c.powers.find(r=>r.id===p.parentId&&!r.parentId);if(!root){notify('Escolha um poder base válido.');break;}}const i=c.powers.findIndex(x=>x.id===ui.editId);if(i>=0)c.powers[i]=clone(p);else c.powers.push(clone(p));if(!p.parentId&&!p.selectedId)p.selectedId=p.id;closeDialog();touch(true);notify('Poder salvo.');break;}
 case'delete-power':{const p=c.powers.find(x=>x.id===id),hasAlts=c.powers.some(x=>x.parentId===id);confirmAction('Remover poder',hasAlts?`Remover “${p?.name}” e todas as suas alternativas?`:`Remover “${p?.name}” da ficha?`,()=>{c.powers=c.powers.filter(x=>x.id!==id&&x.parentId!==id);for(const p of c.powers)if(p.selectedId===id)p.selectedId=p.id;touch(true);},'Remover');break;}
 case'activate-power':{const p=c.powers.find(x=>x.id===id),root=p?.parentId?c.powers.find(x=>x.id===p.parentId):p;if(root){root.enabled=true;root.selectedId=id;touch(true);}break;}
 case'hero-minus':c.heroPoints=Math.max(0,c.heroPoints-1);touch(true);break;
 case'hero-plus':c.heroPoints=Math.min(999,c.heroPoints+1);touch(true);break;
 case'injury-minus':c.injuries=Math.max(0,c.injuries-1);touch(true);break;
 case'injury-plus':c.injuries=Math.min(999,c.injuries+1);touch(true);break;
 case'condition':ui.conditionFocus=value;if(ui.dialogMode==='condition')closeDialog();c.conditions=c.conditions.includes(value)?c.conditions.filter(s=>s!==value):[...c.conditions,value];touch(true);break;
 case'clear-conditions':c.conditions=[];touch(true);break;
 case'clear-log':c.log=[];touch(true);break;
 case'reset-session':confirmAction('Preparar nova sessão','Definir 1 ponto heroico, remover penalidades por dano, limpar condições e rolagens e desativar efeitos temporários deste personagem?',()=>{c.heroPoints=1;c.injuries=0;c.conditions=[];c.log=[];c.temporary.forEach(m=>m.active=false);touch(true);},'Preparar');break;
 case'roll-initiative':roll('Iniciativa',calculations(c).initiative+calculations(c).testPenalty);break;
 case'roll-attack':{const a=attacksFor(c).find(a=>a.id===id);if(a&&!a.noRoll&&!a.disabled)roll(a.name,a.bonus,true,a.crit);break;}
 case'roll-defense':{const calc=calculations(c);let bonus=defenseInCombat(c,value,calc);if(bonus!==null){bonus+=calc.testPenalty;if(value==='toughness')bonus-=c.injuries;}roll(DEFENSES.find(d=>d[0]===value)?.[1]||'Salvamento',bonus);break;}
 case'add-complication':openEntry('complication');break;
 case'edit-complication':openEntry('complication',id);break;
 case'delete-complication':c.complications=c.complications.filter(x=>x.id!==id);touch(true);break;
 case'add-equipment':openEntry('equipment');break;
 case'edit-equipment':openEntry('equipment',id);break;
 case'save-entry':{const name=$('entry-name').value.trim();if(!name){notify('Informe o nome.');break;}const list=ui.dialogMode==='equipment'?c.equipment:c.complications,entry=ui.dialogMode==='equipment'?{id:ui.editId||uid(),name,cost:bounded($('entry-cost').value,0,100000),quantity:integer($('entry-quantity').value,1,999,1),notes:$('entry-notes').value}:{id:ui.editId||uid(),name,type:$('entry-type').value,notes:$('entry-notes').value};const i=list.findIndex(x=>x.id===ui.editId);if(i>=0)list[i]=entry;else list.push(entry);closeDialog();touch(true);break;}
 case'delete-entry':if(ui.dialogMode==='equipment')c.equipment=c.equipment.filter(x=>x.id!==ui.editId);else c.complications=c.complications.filter(x=>x.id!==ui.editId);closeDialog();touch(true);break;
 }
});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
$('dialog').addEventListener('cancel',()=>{ui.dialogMode='';ui.confirmed=null;});
window.addEventListener('beforeunload',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});
loadApp();
</script>
</body>
</html>
